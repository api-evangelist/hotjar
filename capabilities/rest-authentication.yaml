naftiko: 1.0.0-alpha2
info:
  label: Hotjar REST API — Authentication
  description: 'Hotjar REST API — Authentication. 1 operations. Lead operation: Obtain an OAuth access token. Self-contained
    Naftiko capability covering one Hotjar business surface.'
  tags:
  - Hotjar
  - Authentication
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    HOTJAR_API_KEY: HOTJAR_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-authentication
    baseUri: https://api.hotjar.io/v1
    description: Hotjar REST API — Authentication business capability. Self-contained, no shared references.
    resources:
    - name: oauth-token
      path: /oauth/token
      operations:
      - name: createoauthtoken
        method: POST
        description: Obtain an OAuth access token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.HOTJAR_API_KEY}}'
  exposes:
  - type: rest
    namespace: rest-authentication-rest
    port: 8080
    description: REST adapter for Hotjar REST API — Authentication. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/oauth/token
      name: oauth-token
      description: REST surface for oauth-token.
      operations:
      - method: POST
        name: createoauthtoken
        description: Obtain an OAuth access token
        call: rest-authentication.createoauthtoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-authentication-mcp
    port: 9090
    transport: http
    description: MCP adapter for Hotjar REST API — Authentication. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: obtain-oauth-access-token
      description: Obtain an OAuth access token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-authentication.createoauthtoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
